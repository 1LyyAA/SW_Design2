syntax = "proto3";

package rate;

option java_multiple_files = true;
option java_package = "com.example.rate.grpc";

service CurrencyRateService {
  rpc GetRate (RateRequest) returns (RateResponse);
}

message RateRequest {
  string pair = 1;
}

message RateResponse {
  string pair = 1;
  double rate = 2;
  int64 timestamp = 3;
}